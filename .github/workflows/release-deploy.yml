name: CI/CD Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-deploy
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      GHCR_IMAGE: ghcr.io/${{ github.repository }}
      DEPLOY_IMAGE: ghcr.nju.edu.cn/${{ github.repository }}
      TAG: ${{ github.ref_name }} # 例如 v1.2.3
    outputs:
      image: ${{ steps.out-image.outputs.image }}
      pull_image: ${{ steps.out-image.outputs.pull_image }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Build with Maven
        run: mvn -B -DskipTests package --no-transfer-progress

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: |
          set -e
          time docker build \
            -t "${GHCR_IMAGE}:${TAG}" \
            -t "${GHCR_IMAGE}:prod-latest" \
            .

      - name: Push image
        run: |
          set -e
          time docker push "${GHCR_IMAGE}:${TAG}"
          time docker push "${GHCR_IMAGE}:prod-latest"

      - name: Compute image names
        id: out-image
        run: |
          set -e
          echo "image=${GHCR_IMAGE}:${TAG}" >> "$GITHUB_OUTPUT"
          echo "pull_image=${DEPLOY_IMAGE}:${TAG}" >> "$GITHUB_OUTPUT"

  smoke-test:
    name: Smoke Test (prod image)
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: read
      packages: read
    env:
      IMAGE: ${{ needs.build-and-push.outputs.image }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres" --health-interval=5s --health-timeout=5s --health-retries=20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping || exit 1" --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare DB client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client curl jq

      - name: Create database for smoke
        run: |
          for i in $(seq 1 60); do
            pg_isready -h 127.0.0.1 -p 5432 -U postgres && break || sleep 2
          done
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -p 5432 -c "CREATE DATABASE qiaoya_community;" || true

      - name: Run app container
        run: |
          echo "Pulling $IMAGE"
          docker pull "$IMAGE"
          docker run -d --name app -p 18520:8520 \
            --add-host=host.docker.internal:host-gateway \
            -e SPRING_PROFILES_ACTIVE=dev \
            -e DB_HOST=host.docker.internal -e DB_PORT=5432 -e DB_USERNAME=postgres -e DB_PASSWORD=postgres \
            -e REDIS_HOST=host.docker.internal -e REDIS_PORT=6379 -e REDIS_DATABASE=0 \
            "$IMAGE"

      - name: Wait health up
        run: |
          set -e
          for i in $(seq 1 120); do
            resp=$(curl -fsS http://127.0.0.1:18520/api/public/health || true)
            status=$(echo "$resp" | jq -r '.data.status // .status // empty')
            if [ "$status" = "UP" ]; then echo "Health UP"; exit 0; fi
            sleep 2
          done
          echo "Health timeout" >&2
          docker logs --tail=200 app || true
          exit 1

      - name: Public endpoints smoke
        run: |
          set -e
          curl -fsS http://127.0.0.1:18520/api/public/stats/users | jq . >/dev/null
          curl -fsS http://127.0.0.1:18520/api/public/testimonials | jq . >/dev/null
          curl -fsS http://127.0.0.1:18520/api/public/subscription-plans | jq . >/dev/null

      - name: Cleanup
        if: always()
        run: docker rm -f app || true

  deploy:
    name: Deploy (prod)
    runs-on: ubuntu-latest
    needs: [ build-and-push, smoke-test ]
    steps:
      - name: Deploy via SSH (prod)
        uses: appleboy/ssh-action@v1.0.3
        env:
          # Map environment-specific keys to generic names expected by the script
          SCRIPT_PATH: ${{ vars.PROD_SCRIPT_PATH }}
          IMAGE: ${{ needs.build-and-push.outputs.image }}
          PULL_IMAGE: ${{ needs.build-and-push.outputs.pull_image }}
          PROFILE: prod
          PORT: 8520
          CONTAINER_NAME: qiaoya-community-backend
          ENV_FILE: ${{ vars.PROD_ENV_FILE }}
          UPSTREAM_SWITCH: ${{ vars.UPSTREAM_SWITCH }}
          NGINX_CONF: ${{ vars.NGINX_CONF }}
          TARGET_SIDE: ${{ vars.TARGET_SIDE }}
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          envs: SCRIPT_PATH,IMAGE,PULL_IMAGE,PROFILE,PORT,CONTAINER_NAME,ENV_FILE,UPSTREAM_SWITCH,NGINX_CONF,TARGET_SIDE
          script: |
            set -e
            SCRIPT_PATH="${SCRIPT_PATH:-/www/project/qiaoya/deploy-qiaoya-bluegreen.sh}"
            chmod +x "$SCRIPT_PATH" || true
            "$SCRIPT_PATH"
